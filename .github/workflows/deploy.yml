name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync update manifest from Gitee
        run: |
          mkdir -p public/update
          curl -fsSL \
            "https://raw.giteeusercontent.com/qq2057187934/push-drop-vid/raw/master/update/latest.json" \
            -o public/update/latest.json

      # GitHub Pages 为 HTTPS，直连 HTTP API 会被混合内容拦截；部署前同步到同域静态文件
      - name: Sync cloud config from API
        env:
          DROPVID_API_BASE: ${{ vars.DROPVID_API_BASE }}
        run: |
          API_BASE="${DROPVID_API_BASE:-http://192.144.171.10:3000}"
          mkdir -p public/config
          curl -fsSL "${API_BASE}/api/v1/config/platforms" -o public/config/platforms.json
          curl -fsSL "${API_BASE}/api/v1/config/limits" -o public/config/limits.json
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('public/config')
          for name in ('platforms.json', 'limits.json'):
              data = json.loads((root / name).read_text())
              assert data.get('ok') is True, name
          print('cloud config synced')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: pnpm build
        env:
          # 项目页：https://2030378835.github.io/drop-vid/
          VITE_BASE: /drop-vid/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
